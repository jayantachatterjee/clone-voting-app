name: Vote Application CI/CD

on:
  push:
    branches:
      - master
      - main
#paths:
#  - 'vote/**'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: voting-application
  IMAGE_TAG: voting-${{ github.run_id }}

jobs: 
  build-test-push:
    name: Build, Test and Push Vote Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: vote
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: vote
        run: |
          pytest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Vote Image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Update Vote Deployment
        run: |
          ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          sed -i "/name: voting-container/{n;s|image:.*|image: ${ECR_IMAGE}|;}" deploymentk8/vote-deployment.yml

      - name: Commit Updated Vote Deployment
        run: |
          git config user.name ${{secrets.GIT_USERNAME}}
          git config user.email ${{secrets.GIT_EMAIL}}

          git add deploymentk8/vote-deployment.yml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update vote image to ${IMAGE_TAG}"

          git pull --rebase origin master

          git push origin HEAD:master 