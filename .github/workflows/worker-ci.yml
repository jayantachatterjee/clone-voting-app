name: Worker Application CI/CD

on:
  push:
    branches:
      - master
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: voting-application
  IMAGE_TAG: worker-${{ github.run_id }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        working-directory: worker
        run: |
          dotnet restore

      - name: Build Worker
        working-directory: worker
        run: |
          dotnet build --configuration Release --no-restore

      - name: Run Tests
        working-directory: worker
        run: |
          dotnet test --configuration Release --no-build --verbosity normal

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Commit and Push Worker Deployment
        run: |
          git config user.name ${{secrets.GIT_USERNAME}}
          git config user.email ${{secrets.GIT_EMAIL}}

          git add deploymentk8/worker-deployment.yml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update worker image to ${IMAGE_TAG}"

          git pull --rebase origin master

          git push origin HEAD:master 