apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-deployment
  namespace: test-cluster-namespace
  labels:
    app: voting-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: voting-app

  template:
    metadata:
      labels:
        app: voting-app

    spec:
      containers:
      - name: voting-container
        image: 224039896067.dkr.ecr.ap-south-1.amazonaws.com/voting-application:voting-30919936083
        imagePullPolicy: Always

        ports:
        - containerPort: 80